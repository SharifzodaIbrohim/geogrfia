<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хонанда — Олимпиада ва викторина</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/student.css" />
</head>
<body>
  <div id="loginView" class="auth-shell">
    <form id="studentLoginForm" class="auth-card">
      <h1>Воридшавии хонанда</h1>
      <p class="muted">Танҳо бо ID-е, ки админ додааст</p>
      <label>ID-и шумо</label>
      <input id="studentIdInput" type="text" inputmode="numeric" placeholder="0218923193724217841" required />
      <button type="submit" class="btn primary">Ворид шудан</button>
      <p id="loginError" class="error hidden"></p>
      <p class="muted center"><a href="/">Бозгашт ба сайт</a></p>
    </form>
  </div>

  <div id="appView" class="hidden">
    <header class="topbar">
      <div>
        <strong id="studentName">—</strong>
        <span id="studentMeta" class="muted"></span>
      </div>
      <div class="topbar-actions">
        <a href="/" class="btn ghost">Сайт</a>
        <button id="logoutBtn" type="button" class="btn">Баромадан</button>
      </div>
    </header>

    <main class="panel">
      <section id="listView">
        <h2>Олимпиадаҳои фаъол</h2>
        <div id="olympiadList" class="cards"></div>
        <p id="emptyOly" class="muted hidden">Ҳоло олимпиадаи фаъол нест.</p>
        <h2 style="margin-top:1.5rem">Викторинаҳо</h2>
        <div id="quizList" class="cards"></div>
        <p id="emptyQuiz" class="muted hidden">Ҳоло викторина нест.</p>
      </section>

      <section id="examView" class="hidden exam-shell">
        <div class="exam-card">
          <div class="exam-head">
            <div class="exam-brand">GEOGRAFIA</div>
            <h1 id="examTitle" class="exam-title">—</h1>
            <div class="exam-meta">
              <span id="examTimer" class="exam-chip">—</span>
              <span id="examProgress" class="exam-chip accent">Савол 0 / 0</span>
            </div>
          </div>

          <div id="examQuestionPane" class="exam-body">
            <!-- filled by JS: one question -->
          </div>

          <div class="exam-nav">
            <button type="button" id="examPrevBtn" class="btn ghost">← Previous</button>
            <div id="examDots" class="exam-dots" aria-hidden="true"></div>
            <button type="button" id="examNextBtn" class="btn">Next →</button>
          </div>

          <div class="exam-footer">
            <button type="button" id="submitExamBtn" class="btn primary exam-submit">Супоридан</button>
            <p id="examMsg" class="msg hidden"></p>
          </div>
        </div>
      </section>

      <section id="resultView" class="hidden">
        <div class="card highlight center result-card">
          <h2>Натиҷа</h2>
          <p class="score-big" id="resultScore">0%</p>
          <p id="resultDetail"></p>
          <p id="resultStatus" class="badge"></p>
          <button id="backToListBtn" type="button" class="btn">Бозгашт</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/student.js"></script>
</body>
</html>
