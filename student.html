<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Хонанда — Олимпиада</title>
  <link rel="stylesheet" href="css/platform.css" />
  <link rel="stylesheet" href="css/student.css" />
</head>
<body class="student-page">
  <header class="student-top">
    <div id="studentHeader" class="student-header-info"></div>
    <div class="student-top-actions">
      <select id="pfLang" aria-label="Language">
        <option value="tg">TJ</option>
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <a class="btn ghost" href="/">Сайт</a>
      <button type="button" class="btn" id="logoutBtn">Баромадан</button>
    </div>
  </header>

  <main>
    <section id="loginView">
      <form id="studentLoginForm" class="card login-card">
        <h1>Воридшавии хонанда</h1>
        <label>ID-и хонанда
          <input id="studentIdInput" name="studentId" autocomplete="username" required />
        </label>
        <p id="loginError" class="error hidden"></p>
        <button type="submit" class="btn primary">Ворид</button>
      </form>
    </section>

    <section id="appView" class="hidden">
      <section id="listView">
        <h2>Олимпиадаҳо</h2>
        <div id="olympiadList"></div>
        <p id="olympiadEmpty" class="muted hidden">Ҳоло олимпиадаи фаъол нест.</p>
      </section>

      <section id="examView" class="hidden">
        <div class="exam-bar">
          <span id="examTitle"></span>
          <span id="examTimer" class="timer"></span>
          <span id="examProgress"></span>
        </div>
        <div id="examQuestionPane"></div>
        <div class="exam-nav">
          <button type="button" class="btn" id="examPrevBtn">← Қаблӣ</button>
          <button type="button" class="btn" id="examNextBtn">Баъдӣ →</button>
          <button type="button" class="btn primary" id="submitExamBtn">Супоридан</button>
        </div>
      </section>

      <section id="resultView" class="hidden">
        <div class="card result-card">
          <h2>Натиҷа</h2>
          <p class="score-big" id="resultScore">0%</p>
          <p id="resultDetail"></p>
          <p id="resultStatus" class="badge"></p>
          <button type="button" class="btn" id="resultBackBtn">Бозгашт</button>
        </div>
      </section>
    </section>
  </main>

  <noscript><p class="error" style="text-align:center;padding:1rem">Саҳифаро навсозӣ кунед. JavaScript лозим аст.</p></noscript>
  <script>
    window.__geoStudentBoot = true;
  </script>
  <script src="js/i18n.js"></script>
  <script src="js/student.js"></script>
  <script src="js/student-confirm.js"></script>
</body>
</html>
